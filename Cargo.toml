[package]
name = "pebble-index"
version = "0.1.0"
edition = "2024"
default-run = "pebble-index"
description = "Pebble Index 01 BLE and local Apple SpeechAnalyzer client"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
axum = { version = "0.8", features = ["multipart"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
raw-window-handle = "0.6"
futures = "0.3"
log = "0.4"
gpui-component = { version = "=0.5.1", default-features = false }
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "pebble-index"
path = "src/main.rs"

[[bin]]
name = "index-voice"
path = "src/overlay/main.rs"

[build-dependencies]
cc = "1.5.1"
