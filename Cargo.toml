[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
cc = "1.5.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cmake = "0.1"
fs2 = "0.4"
futures = "0.3"
futures-util = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-component = { version = "=0.5.1", default-features = false }
hound = "3.5"
libc = "0.2"
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
whisper-rs = { version = "0.16", features = ["metal"] }
rubato = "0.16"

pebble-core = { path = "crates/core" }
pebble-ring = { path = "crates/pebble-ring" }
pebble-ui = { path = "crates/ui" }
openai-realtime = { path = "crates/openai-realtime" }
qwen-asr = { path = "crates/qwen-asr" }
