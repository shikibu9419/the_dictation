[package]
name = "index-qwen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Qwen3-ASR MLX worker for Index Voice"

[lib]
name = "index_qwen"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tracing = "0.1"

[dev-dependencies]
hound = "3.5"
tempfile = "3"

[build-dependencies]
cmake = "0.1"
